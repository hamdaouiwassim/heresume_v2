<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — CV Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/store.js"></script>
  <script>CVM.Auth.redirectIfSignedIn();</script>
</head>
<body>
  <main class="auth">
    <a href="index.html" class="logo">CV<span>Maker</span></a>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to continue working on your resumes.</p>

      <form id="loginForm" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="input-action" data-toggle-password>Show</button>
          </div>
        </div>
        <p class="form-error" data-form-error hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>
    </div>

    <p class="auth-switch">Don’t have an account? <a href="register.html">Create one</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
