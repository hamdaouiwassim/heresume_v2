<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/logos/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logos/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logos/favicon-16x16.png">
  <link rel="apple-touch-icon" href="images/logos/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>Log in — HResume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/motion.js"></script>
  <script>CVM.Auth.redirectIfSignedIn();</script>
</head>
<body>
  <main class="auth">
    <a href="index.html" class="logo"><span class="logo-mark"><img src="images/logos/logo.webp" alt=""></span>H<span>Resume</span></a>

    <div class="auth-card">
      <nav class="auth-tabs" aria-label="Account">
        <a href="login.html" class="is-active" aria-current="page">Log in</a>
        <a href="register.html">Sign up</a>
      </nav>

      <h1>Welcome back</h1>
      <p class="muted">Log in to continue working on your resumes.</p>

      <button type="button" class="btn btn-secondary btn-block btn-lg btn-google" data-google-signin>
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <p class="form-error" data-google-error hidden></p>
      <div class="auth-divider"><span>or</span></div>

      <form id="loginForm" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="input-action" data-toggle-password>Show</button>
          </div>
        </div>
        <p class="form-error" data-form-error hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>
    </div>

    <p class="auth-switch">Don’t have an account? <a href="register.html">Create one</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
