<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — CV Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/store.js"></script>
  <script>CVM.Auth.requireUser();</script>
</head>
<body data-page="account">
  <header class="app-header">
    <div class="container app-header-inner">
      <a href="dashboard.html" class="logo">CV<span>Maker</span></a>
      <nav class="app-nav">
        <a href="dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="resumes.html" data-nav="resumes">Resumes</a>
        <a href="account.html" data-nav="account">Account</a>
      </nav>
      <div class="app-user">
        <a href="account.html" class="avatar" data-user-initials title="Account"></a>
        <button class="btn btn-ghost btn-sm" data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <div>
        <h1>Account</h1>
        <p class="muted" id="memberSince"></p>
      </div>
    </div>

    <div class="settings">
      <section class="card settings-card">
        <h2>Profile</h2>
        <p class="muted">Used to prefill new resumes.</p>
        <form id="profileForm" class="form" novalidate>
          <div class="grid-2">
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <span class="form-note" data-note></span>
          </div>
        </form>
      </section>

      <section class="card settings-card">
        <h2>Password</h2>
        <p class="muted">Use at least 8 characters.</p>
        <form id="passwordForm" class="form" novalidate>
          <div class="field">
            <label for="current">Current password</label>
            <input id="current" name="current" type="password" autocomplete="current-password">
          </div>
          <div class="field">
            <label for="next">New password</label>
            <div class="input-wrap">
              <input id="next" name="next" type="password" autocomplete="new-password">
              <button type="button" class="input-action" data-toggle-password>Show</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update password</button>
            <span class="form-note" data-note></span>
          </div>
        </form>
      </section>

      <section class="card settings-card settings-card--danger">
        <h2>Delete account</h2>
        <p class="muted">Permanently remove your account and all of your resumes.</p>
        <button class="btn btn-danger" id="deleteAccount">Delete account</button>
      </section>
    </div>
  </main>

  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
