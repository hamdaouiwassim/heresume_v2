<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/logos/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logos/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logos/favicon-16x16.png">
  <link rel="apple-touch-icon" href="images/logos/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>Create account — HResume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/store.js"></script>
  <script>CVM.Auth.redirectIfSignedIn();</script>
</head>
<body>
  <main class="auth">
    <a href="index.html" class="logo"><span class="logo-mark"><img src="images/logos/logo.webp" alt=""></span>H<span>Resume</span></a>

    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">Start building your resume in a few minutes.</p>

      <form id="registerForm" class="form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="input-action" data-toggle-password>Show</button>
          </div>
          <span class="field-hint">At least 8 characters.</span>
        </div>
        <p class="form-error" data-form-error hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
        <p class="form-legal">By creating an account you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy policy</a>.</p>
      </form>
    </div>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
