<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/logos/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logos/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logos/favicon-16x16.png">
  <link rel="apple-touch-icon" href="images/logos/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>Resumes — HResume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/resume.css">
  <script src="js/store.js"></script>
  <script>CVM.Auth.requireUser();</script>
</head>
<body data-page="resumes">
  <header class="app-header">
    <div class="container app-header-inner">
      <a href="dashboard.html" class="logo"><span class="logo-mark"><img src="images/logos/logo.webp" alt=""></span>H<span>Resume</span></a>
      <nav class="app-nav">
        <a href="dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="resumes.html" data-nav="resumes">Resumes</a>
      </nav>
      <div class="user-menu" id="userMenu">
        <button type="button" class="user-menu-button" id="userMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenuList">
          <span class="avatar" data-user-initials></span>
          <span class="user-menu-name" data-user-name></span>
        </button>
        <div class="user-menu-list" id="userMenuList" role="menu" hidden>
          <div class="user-menu-head">
            <strong data-user-name></strong>
            <span data-user-email></span>
          </div>
          <a href="account.html" role="menuitem" data-nav="account">Account</a>
          <button type="button" role="menuitem" data-action="logout">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <div>
        <h1>Resumes</h1>
        <p class="muted" id="countLabel"></p>
      </div>
      <button class="btn btn-primary" data-action="create">New resume</button>
    </div>

    <div class="toolbar" id="toolbar">
      <input type="search" class="input" id="search" placeholder="Search resumes" aria-label="Search resumes">
      <select class="input" id="sort" aria-label="Sort by">
        <option value="updated">Last edited</option>
        <option value="created">Date created</option>
        <option value="title">Name A–Z</option>
      </select>
    </div>

    <div class="resume-grid" id="resumeGrid"></div>

    <div class="card empty" id="emptyState" hidden>
      <h2>No resumes yet</h2>
      <p class="muted">Create your first resume. You can keep as many versions as you need.</p>
      <button class="btn btn-primary" data-action="create">Create resume</button>
    </div>

    <div class="empty" id="noResults" hidden>
      <h2>No matches</h2>
      <p class="muted">No resume matches your search.</p>
    </div>
  </main>

  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script src="js/resumes.js"></script>
</body>
</html>
